<!doctype html>
<html lang="it" class="h-full">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0b0c0f" />
		<meta
			name="description"
			content="Tempra: giochi cognitivi per atleti nei recuperi tra una serie e l’altra, con parametri regolati dal coach in tempo reale."
		/>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link
			rel="preload"
			href="%sveltekit.assets%/fonts/saira-extra-condensed-800.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="h-full">
		<div style="display: contents" class="h-full">%sveltekit.body%</div>
	</body>
</html>
